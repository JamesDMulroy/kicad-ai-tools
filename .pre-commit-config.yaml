repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: portability
        name: no machine paths or names in the package
        entry: python -m pytest -q -o addopts= tests/test_portability.py
        language: system
        pass_filenames: false
      - id: operation-matrix
        name: operation matrix is current
        entry: python scripts/gen_operation_matrix.py --check
        language: system
        pass_filenames: false
