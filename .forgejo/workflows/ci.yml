name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and Format

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Install dependencies
      run: uv sync --group dev

    - name: Lint with ruff
      run: uv run ruff check kicad_mcp/ tests/

    - name: Check formatting with ruff
      run: uv run ruff format --check kicad_mcp/ tests/

  linux-tests:
    runs-on: ubuntu-latest
    name: Linux-safe tests

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run Linux-safe tests
      run: uv run python -m pytest -o addopts= --noconftest -q tests/test_public_text.py kicad_mcp/adaptive_editor/tests/test_copper.py kicad_mcp/adaptive_editor/tests/test_geometry.py kicad_mcp/adaptive_editor/tests/test_live_session_unit.py kicad_mcp/adaptive_editor/tests/test_plugin_install.py kicad_mcp/adaptive_editor/tests/test_solver.py kicad_mcp/adaptive_editor/tests/test_zz_desktop_guard.py tests/test_cli_tools.py tests/test_courtyard_research.py tests/test_coverage.py tests/test_generated_schematic.py tests/test_hotkeys.py tests/test_ipc.py tests/test_ipc_tools.py tests/test_kicad_env.py tests/test_launcher.py tests/test_library_courtyards.py tests/test_operation_matrix.py tests/test_pcb_schematic_sync.py tests/test_plugin_inspect.py tests/test_plugin_roots.py tests/test_portability.py tests/test_release.py tests/test_schematic_readability.py tests/test_schematic_tools.py tests/test_security_guards.py tests/test_source_search.py tests/test_svg_exports.py tests/test_transport_bounds.py tests/unit/utils/test_path_validator.py tests/unit/utils/test_secure_subprocess.py

  security:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run security scan
      run: uv run bandit -r kicad_mcp/

  build:
    runs-on: ubuntu-latest
    name: Build Package
    needs: [lint, linux-tests]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Build package
      run: uv build

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dist
        path: dist/
